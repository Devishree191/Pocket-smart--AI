<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | PocketSmart AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="background: #f8fafc;">

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="/" style="text-decoration: none;">
        <div class="auth-brand">PocketSmart</div>
        <div class="auth-tagline">AI-Powered Budget Planning</div>
      </a>

      <h2 class="auth-title">Create Your Account</h2>

      <div id="error-alert" style="display: none; background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1.25rem;"></div>

      <form id="register-form">
        <div class="form-group" style="text-align: left;">
          <label for="username">Username</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
          </div>
        </div>

        <div class="form-group" style="text-align: left;">
          <label for="email">Email</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group" style="text-align: left;">
          <label for="password">Password</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
          </div>
        </div>

        <div class="form-group" style="text-align: left;">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          <span>Create Account</span>
          <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </button>
      </form>

      <div style="margin-top: 1.75rem; font-size: 0.88rem; color: #64748b;">
        Already have an account? <a href="/login" style="color: #2563eb; font-weight: 600; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("register-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const pwd = document.getElementById("password").value;
      const confirmPwd = document.getElementById("confirm_password").value;
      const errAlert = document.getElementById("error-alert");
      
      if (pwd !== confirmPwd) {
        errAlert.textContent = "Passwords do not match!";
        errAlert.style.display = "block";
        return;
      }

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Creating account...`;

      const payload = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: pwd
      };

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem("pocketsmart_token", data.access_token);
          localStorage.setItem("pocketsmart_user", payload.username);
          window.location.href = "/dashboard";
        } else {
          const err = await response.json();
          errAlert.textContent = err.detail || "Registration failed";
          errAlert.style.display = "block";
          btn.disabled = false;
          btn.innerHTML = `<span>Create Account</span>`;
        }
      } catch (error) {
        localStorage.setItem("pocketsmart_user", payload.username);
        window.location.href = "/dashboard";
      }
    });
  </script>

</body>
</html>
